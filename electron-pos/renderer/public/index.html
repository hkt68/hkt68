<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2c5aa0" />
    <meta name="description" content="Elite Medya Bilişim POS Sistemi" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Elite Medya POS</title>
    <style>
      * {
        box-sizing: border-box;
      }
      
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #f8f9fa;
      }
      
      .electron-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        flex-direction: column;
        background: linear-gradient(135deg, #2c5aa0 0%, #1e3a6f 100%);
        color: white;
      }
      
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #ffffff30;
        border-top: 4px solid #ffffff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <noscript>Bu uygulama çalışması için JavaScript gerektirir.</noscript>
    <div id="root">
      <!-- Loading screen for Electron -->
      <div class="electron-loading">
        <div class="spinner"></div>
        <h2>Elite Medya POS</h2>
        <p>Uygulama yükleniyor...</p>
      </div>
    </div>
  </body>
</html>
