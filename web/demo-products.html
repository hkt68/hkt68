<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elit Bilişim - Ürün Yönetimi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50" x-data="productsDemo()">
    <!-- Navigation -->
    <nav class="bg-slate-800 shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-4">
                    <div class="flex items-center">
                        <i class="fas fa-chart-bar text-orange-500 text-2xl mr-2"></i>
                        <span class="text-white text-xl font-bold">Elit Bilişim</span>
                    </div>
                    <span class="text-gray-300 text-sm">Stok & Satış Yönetimi</span>
                </div>
                <div class="flex items-center space-x-2 text-gray-300 text-sm">
                    <i class="fas fa-calendar"></i>
                    <span>6 Ekim 2025 Pazartesi</span>
                </div>
            </div>
        </div>
    </nav>

    <div class="flex">
        <!-- Sidebar -->
        <div class="w-64 bg-white shadow-sm min-h-screen">
            <div class="p-4">
                <nav class="space-y-2">
                    <div class="text-gray-700 hover:bg-gray-100 w-full flex items-center px-3 py-2 rounded-lg">
                        <i class="fas fa-home w-5"></i>
                        <span class="ml-3">Dashboard</span>
                    </div>
                    
                    <div class="bg-orange-100 text-orange-700 border-r-2 border-orange-700 w-full flex items-center px-3 py-2 rounded-lg">
                        <i class="fas fa-box w-5"></i>
                        <span class="ml-3">Ürünler</span>
                    </div>
                    
                    <div class="text-gray-700 hover:bg-gray-100 w-full flex items-center px-3 py-2 rounded-lg">
                        <i class="fas fa-tags w-5"></i>
                        <span class="ml-3">Kategoriler</span>
                    </div>
                    
                    <div class="text-gray-700 hover:bg-gray-100 w-full flex items-center px-3 py-2 rounded-lg">
                        <i class="fas fa-cash-register w-5"></i>
                        <span class="ml-3">Satış Yap</span>
                    </div>
                    
                    <div class="text-gray-700 hover:bg-gray-100 w-full flex items-center px-3 py-2 rounded-lg">
                        <i class="fas fa-users w-5"></i>
                        <span class="ml-3">Müşteriler</span>
                    </div>
                    
                    <div class="text-gray-700 hover:bg-gray-100 w-full flex items-center px-3 py-2 rounded-lg">
                        <i class="fas fa-receipt w-5"></i>
                        <span class="ml-3">Satış İşlemleri</span>
                    </div>
                    
                    <div class="text-gray-700 hover:bg-gray-100 w-full flex items-center px-3 py-2 rounded-lg">
                        <i class="fas fa-exclamation-triangle w-5"></i>
                        <span class="ml-3">Borç Takibi</span>
                        <span class="ml-auto bg-red-500 text-white text-xs rounded-full px-2 py-0.5">2</span>
                    </div>
                    
                    <div class="text-gray-700 hover:bg-gray-100 w-full flex items-center px-3 py-2 rounded-lg">
                        <i class="fas fa-chart-bar w-5"></i>
                        <span class="ml-3">Raporlar</span>
                    </div>
                </nav>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 p-6">
            <!-- Ürünler Sayfası -->
            <div class="mb-6 flex items-center justify-between">
                <h1 class="text-2xl font-bold text-gray-900 flex items-center">
                    <i class="fas fa-box text-orange-600 mr-3"></i>
                    Ürün Yönetimi
                </h1>
                <div class="flex space-x-2">
                    <button class="bg-yellow-600 text-white px-4 py-2 rounded-lg hover:bg-yellow-700 transition-colors">
                        <i class="fas fa-exclamation-triangle mr-2"></i>
                        Düşük Stok (2)
                    </button>
                    <button @click="showAddModal = true" 
                            class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                        <i class="fas fa-plus mr-2"></i>
                        Yeni Ürün
                    </button>
                </div>
            </div>

            <!-- Arama ve Filtre -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-6">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div>
                        <input type="text" placeholder="Ürün ara..." 
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <select class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            <option value="">Tüm Kategoriler</option>
                            <option>Elektronik</option>
                            <option>Gıda</option>
                            <option>Tekstil</option>
                        </select>
                    </div>
                    <div>
                        <select class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            <option value="">Stok Durumu</option>
                            <option>Normal Stok</option>
                            <option>Düşük Stok</option>
                            <option>Stok Yok</option>
                        </select>
                    </div>
                    <div>
                        <button class="w-full bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition-colors">
                            <i class="fas fa-sync-alt mr-2"></i>
                            Yenile
                        </button>
                    </div>
                </div>
            </div>

            <!-- Ürün Listesi -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100">
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-4 py-3 text-left text-sm font-medium text-gray-700">Ürün</th>
                                <th class="px-4 py-3 text-left text-sm font-medium text-gray-700">Kategori</th>
                                <th class="px-4 py-3 text-left text-sm font-medium text-gray-700">Barkod</th>
                                <th class="px-4 py-3 text-left text-sm font-medium text-gray-700">Stok</th>
                                <th class="px-4 py-3 text-left text-sm font-medium text-gray-700">Alış</th>
                                <th class="px-4 py-3 text-left text-sm font-medium text-gray-700">Satış</th>
                                <th class="px-4 py-3 text-left text-sm font-medium text-gray-700">Durum</th>
                                <th class="px-4 py-3 text-center text-sm font-medium text-gray-700">İşlemler</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-200">
                            <template x-for="product in products" :key="product.id">
                                <tr class="hover:bg-gray-50">
                                    <td class="px-4 py-3">
                                        <div class="font-medium text-gray-900" x-text="product.name"></div>
                                        <div class="text-sm text-gray-500" x-text="product.unit"></div>
                                    </td>
                                    <td class="px-4 py-3">
                                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
                                              :class="product.categoryClass"
                                              x-text="product.category"></span>
                                    </td>
                                    <td class="px-4 py-3 text-sm text-gray-900" x-text="product.barcode"></td>
                                    <td class="px-4 py-3">
                                        <div class="flex items-center">
                                            <span class="text-sm font-medium" 
                                                  :class="product.stockClass"
                                                  x-text="product.stock"></span>
                                            <button class="ml-2 text-blue-600 hover:text-blue-800">
                                                <i class="fas fa-edit text-xs"></i>
                                            </button>
                                        </div>
                                        <div class="text-xs text-gray-500" x-text="'Min: ' + product.minStock"></div>
                                    </td>
                                    <td class="px-4 py-3 text-sm text-gray-900" x-text="product.costPrice"></td>
                                    <td class="px-4 py-3 text-sm font-medium text-gray-900" x-text="product.salePrice"></td>
                                    <td class="px-4 py-3">
                                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
                                              :class="product.statusClass"
                                              x-text="product.status"></span>
                                    </td>
                                    <td class="px-4 py-3 text-center">
                                        <div class="flex items-center justify-center space-x-2">
                                            <button class="text-blue-600 hover:text-blue-800" title="Düzenle">
                                                <i class="fas fa-edit"></i>
                                            </button>
                                            <button class="text-green-600 hover:text-green-800" title="Stok Güncelle">
                                                <i class="fas fa-boxes"></i>
                                            </button>
                                            <button class="text-red-600 hover:text-red-800" title="Sil">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Ürün Ekleme Modal -->
    <div x-show="showAddModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" x-cloak>
        <div class="bg-white rounded-xl p-6 w-full max-w-2xl mx-4 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-bold text-gray-900">
                    <i class="fas fa-plus text-blue-600 mr-2"></i>
                    Yeni Ürün Ekle
                </h2>
                <button @click="showAddModal = false" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <form>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Ürün Adı *</label>
                        <input type="text" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Barkod</label>
                        <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Kategori</label>
                        <select class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            <option value="">Kategori Seçin</option>
                            <option>Elektronik</option>
                            <option>Gıda</option>
                            <option>Tekstil</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Alış Fiyatı</label>
                        <input type="number" step="0.01" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Satış Fiyatı *</label>
                        <input type="number" step="0.01" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Başlangıç Stok</label>
                        <input type="number" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Min Stok Seviyesi</label>
                        <input type="number" value="5" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Birim</label>
                        <select class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            <option value="adet">Adet</option>
                            <option value="kg">Kg</option>
                            <option value="gram">Gram</option>
                            <option value="litre">Litre</option>
                            <option value="metre">Metre</option>
                            <option value="paket">Paket</option>
                        </select>
                    </div>
                    
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Açıklama</label>
                        <textarea rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                    </div>
                </div>

                <div class="flex justify-end space-x-4 mt-6">
                    <button type="button" @click="showAddModal = false" class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600 transition-colors">
                        İptal
                    </button>
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                        <i class="fas fa-save mr-2"></i>
                        Kaydet
                    </button>
                </div>
            </form>
        </div>
    </div>

    <style>
        [x-cloak] { display: none !important; }
    </style>

    <script>
        function productsDemo() {
            return {
                showAddModal: false,
                products: [
                    {
                        id: 1,
                        name: 'iPhone 14',
                        category: 'Elektronik',
                        categoryClass: 'bg-blue-100 text-blue-800',
                        barcode: '123456789',
                        stock: 5,
                        minStock: 10,
                        stockClass: 'text-red-600',
                        costPrice: '₺25.000,00',
                        salePrice: '₺30.000,00',
                        status: 'Düşük Stok',
                        statusClass: 'bg-yellow-100 text-yellow-800',
                        unit: 'adet'
                    },
                    {
                        id: 2,
                        name: 'Samsung TV 55"',
                        category: 'Elektronik',
                        categoryClass: 'bg-blue-100 text-blue-800',
                        barcode: '987654321',
                        stock: 15,
                        minStock: 5,
                        stockClass: 'text-gray-900',
                        costPrice: '₺15.000,00',
                        salePrice: '₺18.000,00',
                        status: 'Normal',
                        statusClass: 'bg-green-100 text-green-800',
                        unit: 'adet'
                    },
                    {
                        id: 3,
                        name: 'Kahve 1kg',
                        category: 'Gıda',
                        categoryClass: 'bg-orange-100 text-orange-800',
                        barcode: '456789123',
                        stock: 0,
                        minStock: 20,
                        stockClass: 'text-red-600',
                        costPrice: '₺180,00',
                        salePrice: '₺220,00',
                        status: 'Stok Yok',
                        statusClass: 'bg-red-100 text-red-800',
                        unit: 'kg'
                    }
                ]
            }
        }
    </script>
</body>
</html>
