<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elit Bilişim - POS Satış</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50" x-data="posDemo()">
    <!-- Navigation -->
    <nav class="bg-slate-800 shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-4">
                    <div class="flex items-center">
                        <i class="fas fa-chart-bar text-orange-500 text-2xl mr-2"></i>
                        <span class="text-white text-xl font-bold">Elit Bilişim</span>
                    </div>
                    <span class="text-gray-300 text-sm">Stok & Satış Yönetimi</span>
                </div>
                <div class="flex items-center space-x-2 text-gray-300 text-sm">
                    <i class="fas fa-calendar"></i>
                    <span>6 Ekim 2025 Pazartesi</span>
                </div>
            </div>
        </div>
    </nav>

    <div class="flex">
        <!-- Sidebar -->
        <div class="w-64 bg-white shadow-sm min-h-screen">
            <div class="p-4">
                <nav class="space-y-2">
                    <div class="text-gray-700 hover:bg-gray-100 w-full flex items-center px-3 py-2 rounded-lg">
                        <i class="fas fa-home w-5"></i>
                        <span class="ml-3">Dashboard</span>
                    </div>
                    
                    <div class="text-gray-700 hover:bg-gray-100 w-full flex items-center px-3 py-2 rounded-lg">
                        <i class="fas fa-box w-5"></i>
                        <span class="ml-3">Ürünler</span>
                    </div>
                    
                    <div class="text-gray-700 hover:bg-gray-100 w-full flex items-center px-3 py-2 rounded-lg">
                        <i class="fas fa-tags w-5"></i>
                        <span class="ml-3">Kategoriler</span>
                    </div>
                    
                    <div class="bg-green-100 text-green-700 border-r-2 border-green-700 w-full flex items-center px-3 py-2 rounded-lg">
                        <i class="fas fa-cash-register w-5"></i>
                        <span class="ml-3">Satış Yap</span>
                    </div>
                    
                    <div class="text-gray-700 hover:bg-gray-100 w-full flex items-center px-3 py-2 rounded-lg">
                        <i class="fas fa-users w-5"></i>
                        <span class="ml-3">Müşteriler</span>
                    </div>
                    
                    <div class="text-gray-700 hover:bg-gray-100 w-full flex items-center px-3 py-2 rounded-lg">
                        <i class="fas fa-receipt w-5"></i>
                        <span class="ml-3">Satış İşlemleri</span>
                    </div>
                    
                    <div class="text-gray-700 hover:bg-gray-100 w-full flex items-center px-3 py-2 rounded-lg">
                        <i class="fas fa-exclamation-triangle w-5"></i>
                        <span class="ml-3">Borç Takibi</span>
                        <span class="ml-auto bg-red-500 text-white text-xs rounded-full px-2 py-0.5">2</span>
                    </div>
                    
                    <div class="text-gray-700 hover:bg-gray-100 w-full flex items-center px-3 py-2 rounded-lg">
                        <i class="fas fa-chart-bar w-5"></i>
                        <span class="ml-3">Raporlar</span>
                    </div>
                </nav>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 p-6">
            <!-- POS Satış Sayfası -->
            <div class="mb-6 flex items-center justify-between">
                <h1 class="text-2xl font-bold text-gray-900 flex items-center">
                    <i class="fas fa-cash-register text-green-600 mr-3"></i>
                    Satış Yap
                </h1>
                <div class="flex space-x-2">
                    <button class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition-colors">
                        <i class="fas fa-times mr-2"></i>
                        Temizle
                    </button>
                    <button class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition-colors">
                        <i class="fas fa-check mr-2"></i>
                        Satışı Tamamla
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Sol: Ürün Seçimi -->
                <div class="lg:col-span-2 space-y-6">
                    <!-- Ürün Arama -->
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">Ürün Seç</h3>
                        <div class="flex space-x-4 mb-4">
                            <div class="flex-1">
                                <input type="text" placeholder="Ürün adı veya barkod ile ara..." 
                                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500">
                            </div>
                            <button class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600">
                                Temizle
                            </button>
                        </div>
                        
                        <!-- Kategori Filtreleme -->
                        <div class="flex space-x-2 mb-4 overflow-x-auto">
                            <button class="bg-green-600 text-white px-3 py-1 rounded-full text-sm whitespace-nowrap">
                                Tümü
                            </button>
                            <button class="bg-blue-600 text-white px-3 py-1 rounded-full text-sm whitespace-nowrap">
                                Elektronik
                            </button>
                            <button class="bg-gray-200 text-gray-700 px-3 py-1 rounded-full text-sm whitespace-nowrap">
                                Gıda
                            </button>
                            <button class="bg-gray-200 text-gray-700 px-3 py-1 rounded-full text-sm whitespace-nowrap">
                                Tekstil
                            </button>
                        </div>
                    </div>

                    <!-- Ürün Grid -->
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                            <template x-for="product in products" :key="product.id">
                                <button @click="addToCart(product)" 
                                        class="bg-gray-50 p-3 rounded-lg border border-gray-200 text-left hover:shadow-md transition-all">
                                    <div class="font-medium text-gray-900 text-sm mb-1" x-text="product.name"></div>
                                    <div class="text-xs text-gray-500 mb-2" x-text="product.category"></div>
                                    <div class="text-sm font-bold text-green-600" x-text="product.price"></div>
                                    <div class="text-xs text-gray-500">
                                        Stok: <span x-text="product.stock"></span>
                                    </div>
                                </button>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- Sağ: Sepet ve Ödeme -->
                <div class="space-y-6">
                    <!-- Müşteri Seçimi -->
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                        <h3 class="text-lg font-semibold text-gray-900 mb-3">Müşteri</h3>
                        <select class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500">
                            <option value="">Seçiniz (Perakende Satış)</option>
                            <option>Ahmet Yılmaz (0532 123 4567)</option>
                            <option>Fatma Demir (0541 987 6543)</option>
                            <option>Mehmet Kaya (0555 111 2233)</option>
                        </select>
                    </div>

                    <!-- Sepet -->
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                        <h3 class="text-lg font-semibold text-gray-900 mb-3 flex items-center">
                            <i class="fas fa-shopping-cart mr-2"></i>
                            Sepet (<span x-text="cart.length"></span>)
                        </h3>
                        
                        <div class="space-y-2 max-h-80 overflow-y-auto">
                            <template x-for="(item, index) in cart" :key="index">
                                <div class="flex items-center justify-between p-2 bg-gray-50 rounded-lg">
                                    <div class="flex-1">
                                        <div class="font-medium text-sm" x-text="item.name"></div>
                                        <div class="text-xs text-gray-500" x-text="item.price + ' x ' + item.quantity"></div>
                                    </div>
                                    <div class="flex items-center space-x-2">
                                        <button @click="updateQuantity(index, -1)" 
                                                class="w-6 h-6 bg-red-500 text-white rounded-full text-xs flex items-center justify-center">
                                            -
                                        </button>
                                        <span class="text-sm font-medium w-8 text-center" x-text="item.quantity"></span>
                                        <button @click="updateQuantity(index, 1)" 
                                                class="w-6 h-6 bg-green-500 text-white rounded-full text-xs flex items-center justify-center">
                                            +
                                        </button>
                                        <button @click="removeFromCart(index)" 
                                                class="w-6 h-6 bg-gray-400 text-white rounded-full text-xs flex items-center justify-center ml-2">
                                            ×
                                        </button>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <!-- Sepet Boş -->
                        <div x-show="cart.length === 0" class="text-center py-8">
                            <i class="fas fa-shopping-cart text-4xl text-gray-300 mb-2"></i>
                            <p class="text-gray-500 text-sm">Sepetiniz boş</p>
                            <p class="text-gray-400 text-xs">Ürün seçerek satışa başlayın</p>
                        </div>
                    </div>

                    <!-- Toplam ve Ödeme -->
                    <div x-show="cart.length > 0" class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">Ödeme</h3>
                        
                        <!-- Toplam -->
                        <div class="border-t border-gray-200 pt-4 mb-4">
                            <div class="flex justify-between items-center text-xl font-bold">
                                <span>TOPLAM:</span>
                                <span class="text-green-600" x-text="formatCurrency(total)"></span>
                            </div>
                        </div>

                        <!-- Ödeme Türü -->
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Ödeme Türü</label>
                            <select x-model="paymentType" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500">
                                <option value="nakit">Nakit</option>
                                <option value="kart">Kredi/Banka Kartı</option>
                                <option value="havale">Havale/EFT</option>
                                <option value="veresiye">Veresiye</option>
                            </select>
                        </div>

                        <!-- Ödenen Tutar -->
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Ödenen Tutar</label>
                            <input type="number" step="0.01" x-model="paidAmount" 
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500">
                        </div>

                        <!-- Para Üstü -->
                        <div x-show="paymentType !== 'veresiye' && parseFloat(paidAmount) > total" 
                             class="mb-4 p-3 bg-blue-50 border border-blue-200 rounded-lg">
                            <div class="flex justify-between items-center">
                                <span class="text-blue-800 font-medium">Para Üstü:</span>
                                <span class="text-blue-800 font-bold" x-text="formatCurrency(parseFloat(paidAmount || 0) - total)"></span>
                            </div>
                        </div>

                        <!-- Kalan Borç -->
                        <div x-show="parseFloat(paidAmount || 0) < total" 
                             class="mb-4 p-3 bg-orange-50 border border-orange-200 rounded-lg">
                            <div class="flex justify-between items-center">
                                <span class="text-orange-800 font-medium">Kalan Borç:</span>
                                <span class="text-orange-800 font-bold" x-text="formatCurrency(total - parseFloat(paidAmount || 0))"></span>
                            </div>
                        </div>

                        <!-- Hızlı Ödeme Butonları -->
                        <div x-show="paymentType === 'nakit'" class="grid grid-cols-3 gap-2 mb-4">
                            <button @click="paidAmount = total" 
                                    class="bg-green-100 text-green-800 py-2 rounded text-sm hover:bg-green-200">
                                Tam Para
                            </button>
                            <button @click="paidAmount = Math.ceil(total / 5) * 5" 
                                    class="bg-blue-100 text-blue-800 py-2 rounded text-sm hover:bg-blue-200">
                                5₺'ye Yuvarla
                            </button>
                            <button @click="paidAmount = Math.ceil(total / 10) * 10" 
                                    class="bg-purple-100 text-purple-800 py-2 rounded text-sm hover:bg-purple-200">
                                10₺'ye Yuvarla
                            </button>
                        </div>

                        <!-- Satış Tamamla Butonu -->
                        <button class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700">
                            <i class="fas fa-check mr-2"></i>
                            Satışı Tamamla
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <style>
        [x-cloak] { display: none !important; }
    </style>

    <script>
        function posDemo() {
            return {
                paymentType: 'nakit',
                paidAmount: 250,
                products: [
                    { id: 1, name: 'iPhone 14', category: 'Elektronik', price: '₺30.000,00', stock: 5 },
                    { id: 2, name: 'Samsung TV', category: 'Elektronik', price: '₺18.000,00', stock: 15 },
                    { id: 3, name: 'Kahve 1kg', category: 'Gıda', price: '₺220,00', stock: 20 },
                    { id: 4, name: 'Gömlek', category: 'Tekstil', price: '₺450,00', stock: 8 },
                    { id: 5, name: 'Laptop', category: 'Elektronik', price: '₺25.000,00', stock: 3 },
                    { id: 6, name: 'Çay 500g', category: 'Gıda', price: '₺180,00', stock: 25 }
                ],
                cart: [
                    { id: 3, name: 'Kahve 1kg', price: '₺220,00', quantity: 1 },
                    { id: 6, name: 'Çay 500g', price: '₺180,00', quantity: 2 }
                ],
                
                get total() {
                    return this.cart.reduce((sum, item) => {
                        return sum + (parseFloat(item.price.replace('₺', '').replace(',', '')) * item.quantity);
                    }, 0);
                },

                addToCart(product) {
                    const existing = this.cart.find(item => item.id === product.id);
                    if (existing) {
                        existing.quantity++;
                    } else {
                        this.cart.push({ ...product, quantity: 1 });
                    }
                },

                updateQuantity(index, change) {
                    this.cart[index].quantity += change;
                    if (this.cart[index].quantity <= 0) {
                        this.cart.splice(index, 1);
                    }
                },

                removeFromCart(index) {
                    this.cart.splice(index, 1);
                },

                formatCurrency(amount) {
                    return new Intl.NumberFormat('tr-TR', {
                        style: 'currency',
                        currency: 'TRY'
                    }).format(amount);
                }
            }
        }
    </script>
</body>
</html>
